name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Calculations (test_core.py)
        run: python test_core.py

      - name: Every page, local and browser modes (test_app_headless.py)
        run: python test_app_headless.py

      - name: Every page in real Streamlit (dev/apptest_smoke.py)
        run: python dev/apptest_smoke.py

      - name: First-time user walkthrough with the stand-in (not DLBreach)
        if: runner.os != 'Windows'
        run: python dev/qa_walkthrough.py

      - name: Feature-by-feature QA, local and browser paths (stand-in)
        if: runner.os != 'Windows'
        run: python dev/qa_features.py
