<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DLBreach Dashboard</title>
  <meta name="description" content="An accessible interface to the DLBreach dam and levee breach model (Wu 2013, 2016), running in the browser." />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <style>
    #loading { font-family: "Segoe UI", system-ui, sans-serif; color: #17324D;
               max-width: 640px; margin: 12vh auto; padding: 0 1.5rem; }
    #loading h1 { font-size: 1.5rem; margin: 0 0 .5rem 0; }
    #loading p { color: #5D6B78; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>DLBreach Dashboard</h1>
    <p>Loading Python in your browser. The first visit takes a minute while
       the packages download; later visits are faster. Nothing is installed
       on your computer and nothing you enter leaves this page.</p>
    <p>Works in Chrome, Edge and Safari.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from
      "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    // Every module the app imports is fetched from this folder and mounted
    // into the in-browser file system under the same name.
    const modules = [
      "app.py",
      "dlbreach_about.py",
      "dlbreach_batch.py",
      "dlbreach_cases.py",
      "dlbreach_data.py",
      "dlbreach_empirical.py",
      "dlbreach_help.py",
      "dlbreach_templates.py",
      "dlbreach_io.py",
      "dlbreach_mc.py",
      "dlbreach_report.py",
      "dlbreach_tailings.py",
      "dlbreach_ui.py",
      "dlbreach_units.py",
      "dlbreach_viz.py",
    ];
    // Worked examples offered on the Project page.
    const examples = [
      "test_cases/T1_water_overtopping.json",
      "test_cases/T2_water_piping.json",
      "test_cases/T3_water_overtopping.json",
      "test_cases/T4_water_piping.json",
      // Prof. Wu's validation inputs and the data files they name.
      "test_cases/wu_2016/Banqiao_cards.txt",
      "test_cases/wu_2016/BigBay_cards.txt",
      "test_cases/wu_2016/HansonE1S1_cards.txt",
      "test_cases/wu_2016/Impactfld03_cards.txt",
      "test_cases/wu_2016/Mecox_TideDS.txt",
      "test_cases/wu_2016/Mecox_WSLBay.txt",
      "test_cases/wu_2016/Mecox_WaveDS.txt",
      "test_cases/wu_2016/Mecox_Wind.txt",
      "test_cases/wu_2016/Mecox_cards_WSLbay.txt",
      "test_cases/wu_2016/Sutter_cards_BasinVolume.txt",
      "test_cases/wu_2016/Teton_cards.txt",
      "test_cases/wu_2016/Yahekou_R_cards.txt",
      "test_cases/wu_2016/Yahekou_cards.txt",
      "test_cases/wu_2016/Yigong_cards.txt",
      "test_cases/wu_2016/Zwin_cards.txt",
    ];
    const files = {};
    for (const m of [...modules, ...examples]) files[m] = { url: `./${m}` };

    mount(
      {
        // openpyxl and python-docx are fixed to the versions tested locally;
        // matplotlib comes with the Pyodide release that stlite fixes.
        requirements: ["matplotlib", "openpyxl==3.1.5", "python-docx==1.2.0"],
        entrypoint: "app.py",
        streamlitConfig: {
          "theme.base": "light",
          "theme.primaryColor": "#1D5C83",
          "theme.backgroundColor": "#FFFFFF",
          "theme.secondaryBackgroundColor": "#F3F6F9",
          "theme.textColor": "#17324D",
          "client.toolbarMode": "minimal",
          "browser.gatherUsageStats": false,
        },
        files,
      },
      document.getElementById("root"),
    );
    // Hide the loading note once the app has taken over the page.
    new MutationObserver((_, obs) => {
      if (document.querySelector("#root .stApp")) {
        document.getElementById("loading").remove();
        obs.disconnect();
      }
    }).observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
</body>
</html>
